name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            cd ~/kama

            echo "📥 Получаем изменения..."
            git pull

            echo "📦 Устанавливаем зависимости..."
            npm ci

            echo "🔨 Собираем проект..."
            npm run build

            echo "💾 Создаем резервную копию..."
            rm -rf /var/www/love-polina.bak
            cp -r /var/www/love-polina /var/www/love-polina.bak

            echo "🚀 Публикуем новую версию..."
            cp -r dist/* /var/www/love-polina/

            echo "✅ Деплой завершен!"
